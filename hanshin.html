<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阪神タイガース 速報</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a1200;
      background-image: radial-gradient(ellipse at center, #2a1e00 0%, #1a1200 60%, #0d0900 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ===== ヘッダー ===== */
    .page-header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid rgba(255,200,0,.15); }
    .team-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg,#f5c000,#c89000);
      color: #1a0a00; padding: 5px 18px; border-radius: 24px;
      font-size: .78rem; font-weight: 800; letter-spacing: .1em; margin-bottom: 7px;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 900; color: #f5c000; }
    .page-header p  { font-size: .72rem; color: rgba(255,255,255,.35); margin-top: 3px; }

    /* ===== 更新バー ===== */
    .refresh-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 7px 12px; margin-bottom: 14px; font-size: .74rem; gap: 6px;
    }
    .last-updated { color: rgba(255,255,255,.4); flex: 1; }
    .countdown    { color: rgba(245,192,0,.8); font-weight: 700; white-space: nowrap; }
    .btn-refresh  {
      background: rgba(245,192,0,.12); border: 1px solid rgba(245,192,0,.3);
      color: #f5c000; border-radius: 6px; padding: 3px 10px;
      font-size: .72rem; font-weight: 700; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .btn-refresh:hover { background: rgba(245,192,0,.22); }

    /* ===== 勝敗サマリー ===== */
    .record-bar {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      background: rgba(245,192,0,.06); border: 1px solid rgba(245,192,0,.15);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 14px;
    }
    .record-item { text-align: center; }
    .record-num  { font-size: 1.6rem; font-weight: 900; line-height: 1; }
    .record-num.win  { color: #f5c000; }
    .record-num.lose { color: #e06060; }
    .record-num.draw { color: rgba(255,255,255,.4); }
    .record-label { font-size: .64rem; color: rgba(255,255,255,.35); margin-top: 2px; letter-spacing: .05em; }
    .record-sep { font-size: 1.4rem; color: rgba(255,255,255,.15); }
    .streak-badge {
      font-size: .72rem; font-weight: 800; padding: 3px 10px;
      border-radius: 12px; letter-spacing: .05em;
    }
    .streak-win  { background: rgba(245,192,0,.2); color: #f5c000; }
    .streak-lose { background: rgba(200,80,80,.2);  color: #e08080; }
    .streak-draw { background: rgba(150,150,150,.15); color: rgba(200,200,200,.7); }

    /* ===== セクション ===== */
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: .72rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(245,192,0,.7);
      margin-bottom: 7px; padding-left: 2px;
    }

    /* ===== 試合カード ===== */
    .game-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      border-left: 3px solid transparent;
      border-radius: 10px; padding: 10px 14px; margin-bottom: 7px; transition: background .2s;
    }
    .game-card:hover { background: rgba(255,255,255,.07); }
    .game-card.win   { border-left-color: #f5c000; }
    .game-card.lose  { border-left-color: rgba(200,80,80,.7); }
    .game-card.draw  { border-left-color: rgba(150,150,150,.4); }
    .game-card.next  { border-left-color: rgba(80,150,200,.5); }

    .game-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 7px; font-size: .68rem;
    }
    .game-date-str { color: rgba(255,255,255,.4); }
    .game-badges   { display: flex; align-items: center; gap: 5px; }
    .badge {
      font-size: .62rem; font-weight: 800; padding: 2px 7px;
      border-radius: 10px; letter-spacing: .04em;
    }
    .badge-ft   { background: rgba(255,255,255,.08); color: rgba(255,255,255,.45); }
    .badge-ns   { background: rgba(80,150,200,.2);  color: #9ab8f0; }
    .badge-win  { background: rgba(245,192,0,.2);    color: #f5c000; }
    .badge-lose { background: rgba(200,80,80,.2);    color: #e08080; }
    .badge-draw { background: rgba(150,150,150,.15); color: rgba(200,200,200,.7); }

    .matchup {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .team-block { flex: 1; text-align: center; }
    .team-name  { font-size: .82rem; font-weight: 700; color: rgba(255,255,255,.7); }
    .team-name.tigers { color: #f5c000; }
    .score {
      font-size: 1.7rem; font-weight: 900; line-height: 1.1; margin-top: 1px;
    }
    .score.tigers { color: #f5c000; }
    .score.opp    { color: rgba(255,255,255,.65); }
    .score.none   { font-size: .9rem; color: rgba(255,255,255,.2); }
    .vs { font-size: .76rem; color: rgba(255,255,255,.25); font-weight: 700; flex-shrink: 0; }

    .game-meta {
      font-size: .64rem; color: rgba(255,255,255,.25);
      margin-top: 6px; text-align: center;
    }

    /* ===== イニング表 ===== */
    .inning-table-wrap { margin-top: 8px; overflow-x: auto; }
    .inning-table {
      border-collapse: collapse; width: 100%; font-size: .66rem;
      min-width: 320px;
    }
    .inning-table th, .inning-table td {
      border: 1px solid rgba(255,255,255,.07);
      text-align: center; padding: 3px 5px; white-space: nowrap;
    }
    .inning-table thead th {
      background: rgba(255,255,255,.05); color: rgba(255,255,255,.4);
      font-weight: 700;
    }
    .inning-table .team-col { text-align: left; padding-left: 8px; font-weight: 700; min-width: 70px; }
    .inning-table .tigers-row .team-col { color: #f5c000; }
    .inning-table .total-col { background: rgba(255,255,255,.05); font-weight: 900; }
    .inning-table .tigers-row .total-col { color: #f5c000; }

    /* ===== ローディング・エラー ===== */
    .loading { text-align: center; padding: 24px; color: rgba(255,255,255,.3); font-size: .82rem; }
    .loading .spinner {
      width: 24px; height: 24px; border: 3px solid rgba(245,192,0,.15);
      border-top-color: #f5c000; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center; padding: 16px;
      background: rgba(200,80,80,.08); border: 1px solid rgba(200,80,80,.18);
      border-radius: 8px; color: rgba(220,140,140,.9); font-size: .78rem;
    }
    .empty-msg { text-align: center; padding: 16px; color: rgba(255,255,255,.22); font-size: .78rem; }

    /* ===== フッター ===== */
    .footer { text-align: center; margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
    .btn-back {
      background: transparent; border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; color: rgba(255,255,255,.42);
      font-size: .78rem; padding: 7px 20px; cursor: pointer; transition: all .2s;
    }
    .btn-back:hover { border-color: rgba(255,255,255,.38); color: rgba(255,255,255,.75); }
    .api-note { font-size: .62rem; color: rgba(255,255,255,.18); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="team-badge">🐯 HANSHIN TIGERS</div>
    <h1>阪神タイガース 速報</h1>
    <p>試合結果・スケジュール（自動更新）</p>
  </div>

  <div class="refresh-bar">
    <span class="last-updated" id="last-updated">読み込み中...</span>
    <span class="countdown" id="countdown"></span>
    <button class="btn-refresh" onclick="loadAll()">↻ 更新</button>
  </div>

  <!-- 勝敗サマリー -->
  <div class="record-bar" id="record-bar">
    <div class="record-item"><div class="record-num win" id="rec-w">-</div><div class="record-label">勝</div></div>
    <div class="record-sep">-</div>
    <div class="record-item"><div class="record-num lose" id="rec-l">-</div><div class="record-label">敗</div></div>
    <div class="record-sep">-</div>
    <div class="record-item"><div class="record-num draw" id="rec-d">-</div><div class="record-label">分</div></div>
    <div id="streak-wrap" style="margin-left:6px"></div>
  </div>

  <!-- 直近の結果 -->
  <div class="section">
    <div class="section-title">📋 直近の試合結果</div>
    <div id="results-container"><div class="loading"><div class="spinner"></div>取得中...</div></div>
  </div>

  <!-- 次の試合 -->
  <div class="section">
    <div class="section-title">📅 次の試合</div>
    <div id="next-container"><div class="loading"><div class="spinner"></div>取得中...</div></div>
  </div>

  <div class="footer">
    <button class="btn-back" onclick="location.href='lineup.html'">← スコアボードへ戻る</button>
  </div>
  <div class="api-note">データ提供: TheSportsDB ／ 試合終了後に反映 ／ 数分の遅延あり</div>

  <script>
    const TEAM_ID   = 137506;
    const TEAM_NAME = 'Hanshin Tigers';
    const LEAGUE_ID = 4591;
    const API       = 'https://www.thesportsdb.com/api/v1/json/3';
    const REFRESH   = 180;

    let countdown = REFRESH, timer;

    // ===== チーム名日本語変換 =====
    const JA = {
      'Hanshin Tigers':               '阪神',
      'Yomiuri Giants':               '巨人',
      'Yokohama DeNA BayStars':       'DeNA',
      'Tokyo Yakult Swallows':        'ヤクルト',
      'Hiroshima Toyo Carp':          '広島',
      'Chunichi Dragons':             '中日',
      'Fukuoka SoftBank Hawks':       'ソフトバンク',
      'Tohoku Rakuten Golden Eagles': '楽天',
      'Saitama Seibu Lions':          '西武',
      'Orix Buffaloes':               'オリックス',
      'Chiba Lotte Marines':          'ロッテ',
      'Hokkaido Nippon-Ham Fighters': '日本ハム',
    };
    const ja = n => JA[n] || n;

    // ===== 判定ヘルパー =====
    const isHome  = ev => String(ev.idHomeTeam) === String(TEAM_ID);
    const myScore = ev => isHome(ev) ? ev.intHomeScore : ev.intAwayScore;
    const opScore = ev => isHome(ev) ? ev.intAwayScore : ev.intHomeScore;
    const opName  = ev => ja(isHome(ev) ? ev.strAwayTeam : ev.strHomeTeam);
    const venue   = ev => ev.strVenue || '';

    function result(ev) {
      const m = parseInt(myScore(ev)), o = parseInt(opScore(ev));
      if (isNaN(m)||isNaN(o)) return 'unknown';
      return m>o ? 'win' : m<o ? 'lose' : 'draw';
    }

    function fmtDate(s) {
      if (!s) return '';
      const d = new Date(s+'T00:00:00');
      return `${d.getMonth()+1}/${d.getDate()}`;
    }
    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // ===== イニング表 解析 =====
    function parseInnings(strResult) {
      if (!strResult) return null;
      const blocks = strResult.trim().split(/\n\n+/);
      const rows = [];
      for (const block of blocks) {
        const lines = block.trim().split('\n');
        if (lines.length < 2) continue;
        const teamLine = lines[0].trim();
        const innMatch = lines[1].match(/Innings:\s*([\d\s]+)/);
        const hitMatch = block.match(/Hits:\s*(\d+)/);
        const errMatch = block.match(/Errors:\s*(\d+)/);
        if (!innMatch) continue;
        const innings = innMatch[1].trim().split(/\s+/).map(Number);
        rows.push({
          team: teamLine,
          innings,
          hits:   hitMatch  ? parseInt(hitMatch[1])  : null,
          errors: errMatch  ? parseInt(errMatch[1]) : null,
        });
      }
      return rows.length >= 1 ? rows : null;
    }

    function makeInningTable(strResult, homeTeam, awayTeam) {
      const rows = parseInnings(strResult);
      if (!rows || rows.length < 1) return '';

      // ホーム・アウェー判定して阪神を上に
      const homeJa = ja(homeTeam);
      const awayJa = ja(awayTeam);
      let sorted = rows;
      if (rows.length === 2) {
        // 阪神を1行目に
        const hanshinIdx = rows.findIndex(r => r.team.includes('Hanshin'));
        if (hanshinIdx === 1) sorted = [rows[1], rows[0]];
      }

      const maxInn = Math.max(...sorted.map(r => r.innings.length));
      const headers = Array.from({length: maxInn}, (_,i) => `<th>${i+1}</th>`).join('');

      const makeRow = (row, isTigers) => {
        const cells = row.innings.map(v => `<td>${v}</td>`).join('');
        const total = row.innings.reduce((a,b)=>a+b, 0);
        const cls = isTigers ? 'tigers-row' : '';
        const hits = row.hits !== null ? row.hits : '-';
        const errs = row.errors !== null ? row.errors : '-';
        return `<tr class="${cls}">
          <td class="team-col">${isTigers ? '🐯 阪神' : ja(row.team.split(' ').slice(0,-1).join(' ')) || row.team}</td>
          ${cells}
          <td class="total-col">${total}</td>
          <td>${hits}</td>
          <td>${errs}</td>
        </tr>`;
      };

      const rowsHTML = sorted.map((r, i) => {
        const isTigers = r.team.includes('Hanshin');
        return makeRow(r, isTigers);
      }).join('');

      return `
        <div class="inning-table-wrap">
          <table class="inning-table">
            <thead>
              <tr>
                <th class="team-col">チーム</th>
                ${headers}
                <th class="total-col">計</th>
                <th>安</th>
                <th>失</th>
              </tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
          </table>
        </div>`;
    }

    // ===== カード生成 =====
    function makeResultCard(ev, strResult) {
      const r   = result(ev);
      const ms  = myScore(ev), os = opScore(ev);
      const rLabel = {win:'勝',lose:'負',draw:'分',unknown:''}[r];
      const haLabel = isHome(ev) ? '🏟 H' : '✈ A';
      const innTable = strResult ? makeInningTable(strResult, ev.strHomeTeam, ev.strAwayTeam) : '';

      return `
        <div class="game-card ${r}">
          <div class="game-top">
            <span class="game-date-str">${fmtDate(ev.dateEvent)}（${haLabel}）${venue(ev) ? ' ' + venue(ev) : ''}</span>
            <div class="game-badges">
              <span class="badge badge-ft">終了</span>
              ${rLabel ? `<span class="badge badge-${r}">${rLabel}</span>` : ''}
            </div>
          </div>
          <div class="matchup">
            <div class="team-block">
              <div class="team-name tigers">阪神</div>
              <div class="score tigers">${ms ?? '-'}</div>
            </div>
            <div class="vs">vs</div>
            <div class="team-block">
              <div class="team-name">${opName(ev)}</div>
              <div class="score opp">${os ?? '-'}</div>
            </div>
          </div>
          ${innTable}
        </div>`;
    }

    function makeNextCard(ev) {
      const haLabel = isHome(ev) ? '🏟 H' : '✈ A';
      const timeStr = ev.strTimestamp ? ' ' + fmtTime(ev.strTimestamp) : '';
      return `
        <div class="game-card next">
          <div class="game-top">
            <span class="game-date-str">${fmtDate(ev.dateEvent)}${timeStr}（${haLabel}）${venue(ev) ? ' ' + venue(ev) : ''}</span>
            <span class="badge badge-ns">予定</span>
          </div>
          <div class="matchup">
            <div class="team-block"><div class="team-name tigers">阪神</div><div class="score none">-</div></div>
            <div class="vs">vs</div>
            <div class="team-block"><div class="team-name">${opName(ev)}</div><div class="score none">-</div></div>
          </div>
        </div>`;
    }

    // ===== データ取得 =====
    async function fetchJ(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    async function loadAll() {
      clearInterval(timer);
      countdown = REFRESH;
      startCountdown();

      try {
        const [seasonData, lastData, nextData] = await Promise.all([
          fetchJ(`${API}/eventsseason.php?id=${LEAGUE_ID}&s=2026`),
          fetchJ(`${API}/eventslast.php?id=${TEAM_ID}`),
          fetchJ(`${API}/eventsnext.php?id=${TEAM_ID}`)
        ]);

        // 阪神が絡む試合を絞り込み
        const allGames = (seasonData.events || []).filter(ev =>
          String(ev.idHomeTeam) === String(TEAM_ID) ||
          String(ev.idAwayTeam) === String(TEAM_ID)
        );

        // 勝敗集計
        let w=0, l=0, d=0;
        const finishedGames = allGames.filter(ev => ev.strStatus === 'FT' && myScore(ev) !== null);
        finishedGames.forEach(ev => {
          const r = result(ev);
          if (r==='win') w++;
          else if (r==='lose') l++;
          else if (r==='draw') d++;
        });
        document.getElementById('rec-w').textContent = w;
        document.getElementById('rec-l').textContent = l;
        document.getElementById('rec-d').textContent = d;

        // 連勝/連敗
        const sorted = finishedGames.sort((a,b)=>new Date(b.dateEvent)-new Date(a.dateEvent));
        let streakN=0, streakType='';
        if (sorted.length > 0) {
          streakType = result(sorted[0]);
          for (const ev of sorted) {
            if (result(ev) === streakType) streakN++;
            else break;
          }
        }
        const streakLabel = {win:`${streakN}連勝`, lose:`${streakN}連敗`, draw:`${streakN}連続引分`}[streakType] || '';
        const streakClass = {win:'streak-win', lose:'streak-lose', draw:'streak-draw'}[streakType] || '';
        document.getElementById('streak-wrap').innerHTML =
          streakN > 1 ? `<span class="streak-badge ${streakClass}">${streakLabel}</span>` : '';

        // 直近5試合（降順）
        const recentGames = sorted.slice(0, 5);
        const lastEvMap = {};
        (lastData.results || []).forEach(ev => { lastEvMap[ev.idEvent] = ev; });

        const rc = document.getElementById('results-container');
        if (recentGames.length === 0) {
          rc.innerHTML = '<div class="empty-msg">試合データがありません</div>';
        } else {
          rc.innerHTML = recentGames.map(ev => {
            const detail = lastEvMap[ev.idEvent];
            return makeResultCard(ev, detail ? detail.strResult : null);
          }).join('');
        }

        // 次の試合5件
        const nexts = (nextData.events || []).slice(0, 5);
        const nc = document.getElementById('next-container');
        if (nexts.length === 0) {
          nc.innerHTML = '<div class="empty-msg">次の試合データがありません</div>';
        } else {
          nc.innerHTML = nexts.map(makeNextCard).join('');
        }

        // 最終更新
        const now = new Date();
        document.getElementById('last-updated').textContent =
          `最終更新: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

      } catch(e) {
        const err = `<div class="error-msg">⚠ 取得失敗: ${e.message}</div>`;
        document.getElementById('results-container').innerHTML = err;
        document.getElementById('next-container').innerHTML = err;
      }
    }

    function startCountdown() {
      timer = setInterval(() => {
        countdown--;
        const m = Math.floor(countdown/60), s = countdown%60;
        document.getElementById('countdown').textContent = `更新まで ${m}:${String(s).padStart(2,'0')}`;
        if (countdown <= 0) { clearInterval(timer); loadAll(); }
      }, 1000);
    }

    loadAll();
  </script>
</body>
</html>
