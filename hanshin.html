<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阪神タイガース 速報</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a1200;
      background-image: radial-gradient(ellipse at center, #2a1e00 0%, #1a1200 60%, #0d0900 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    .page-header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid rgba(255,200,0,.15); }
    .team-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg,#f5c000,#c89000);
      color: #1a0a00; padding: 5px 18px; border-radius: 24px;
      font-size: .78rem; font-weight: 800; letter-spacing: .1em; margin-bottom: 7px;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 900; color: #f5c000; }
    .page-header p  { font-size: .72rem; color: rgba(255,255,255,.35); margin-top: 3px; }

    .refresh-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 7px 12px; margin-bottom: 14px; font-size: .74rem; gap: 6px;
    }
    .last-updated { color: rgba(255,255,255,.4); flex: 1; }
    .countdown    { color: rgba(245,192,0,.8); font-weight: 700; white-space: nowrap; }
    .btn-refresh  {
      background: rgba(245,192,0,.12); border: 1px solid rgba(245,192,0,.3);
      color: #f5c000; border-radius: 6px; padding: 3px 10px;
      font-size: .72rem; font-weight: 700; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .btn-refresh:hover { background: rgba(245,192,0,.22); }

    .section { margin-bottom: 16px; }
    .section-title {
      font-size: .72rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(245,192,0,.7);
      margin-bottom: 7px; padding-left: 2px;
    }

    .game-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      border-left: 3px solid transparent;
      border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    }
    .game-card.win  { border-left-color: #f5c000; }
    .game-card.lose { border-left-color: rgba(200,80,80,.7); }
    .game-card.draw { border-left-color: rgba(150,150,150,.4); }
    .game-card.next { border-left-color: rgba(80,150,200,.5); }

    .game-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; font-size: .68rem; flex-wrap: wrap; gap: 4px;
    }
    .game-date-str { color: rgba(255,255,255,.45); }
    .badges { display: flex; gap: 5px; align-items: center; }
    .badge {
      font-size: .62rem; font-weight: 800; padding: 2px 8px;
      border-radius: 10px; letter-spacing: .04em;
    }
    .badge-ft   { background: rgba(255,255,255,.08); color: rgba(255,255,255,.45); }
    .badge-ns   { background: rgba(80,150,200,.2);  color: #9ab8f0; }
    .badge-win  { background: rgba(245,192,0,.2);    color: #f5c000; }
    .badge-lose { background: rgba(200,80,80,.2);    color: #e08080; }
    .badge-draw { background: rgba(160,160,160,.2);  color: rgba(200,200,200,.7); }

    .matchup {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .team-block { flex: 1; text-align: center; }
    .team-name  { font-size: .85rem; font-weight: 700; color: rgba(255,255,255,.7); }
    .team-name.tigers { color: #f5c000; }
    .score { font-size: 1.8rem; font-weight: 900; line-height: 1.1; margin-top: 2px; }
    .score.tigers { color: #f5c000; }
    .score.opp    { color: rgba(255,255,255,.65); }
    .score.none   { font-size: .9rem; color: rgba(255,255,255,.2); }
    .vs { font-size: .76rem; color: rgba(255,255,255,.2); font-weight: 700; flex-shrink: 0; }

    .venue-str { font-size: .64rem; color: rgba(255,255,255,.25); margin-top: 7px; text-align: center; }

    /* イニング表 */
    .inning-wrap { margin-top: 10px; overflow-x: auto; }
    .inn-table { border-collapse: collapse; font-size: .64rem; min-width: 300px; width: 100%; }
    .inn-table th, .inn-table td {
      border: 1px solid rgba(255,255,255,.07);
      text-align: center; padding: 4px 5px; white-space: nowrap;
    }
    .inn-table thead th { background: rgba(255,255,255,.05); color: rgba(255,255,255,.4); font-weight: 700; }
    .inn-table .tname { text-align: left; padding-left: 8px; font-weight: 700; min-width: 60px; }
    .inn-table .t-total { background: rgba(255,255,255,.05); font-weight: 900; }
    .inn-table .tigers-row .tname,
    .inn-table .tigers-row .t-total { color: #f5c000; }

    .loading { text-align: center; padding: 28px; color: rgba(255,255,255,.3); font-size: .82rem; }
    .error-msg {
      padding: 16px; background: rgba(200,80,80,.08);
      border: 1px solid rgba(200,80,80,.18); border-radius: 8px;
      color: rgba(220,140,140,.9); font-size: .78rem; text-align: center;
    }
    .empty-msg { padding: 16px; text-align: center; color: rgba(255,255,255,.22); font-size: .78rem; }

    .footer { text-align: center; margin-top: 16px; }
    .btn-back {
      background: transparent; border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; color: rgba(255,255,255,.42);
      font-size: .78rem; padding: 7px 20px; cursor: pointer; transition: all .2s;
    }
    .btn-back:hover { border-color: rgba(255,255,255,.38); color: rgba(255,255,255,.75); }
    .api-note { font-size: .6rem; color: rgba(255,255,255,.18); text-align: center; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="team-badge">🐯 HANSHIN TIGERS</div>
    <h1>阪神タイガース 速報</h1>
    <p>直近の試合結果・次戦スケジュール</p>
  </div>

  <div class="refresh-bar">
    <span class="last-updated" id="last-updated">読み込み中...</span>
    <span class="countdown" id="countdown"></span>
    <button class="btn-refresh" onclick="loadAll()">↻ 更新</button>
  </div>

  <div class="section">
    <div class="section-title">📋 直近の試合結果</div>
    <div id="result-container"><div class="loading">取得中...</div></div>
  </div>

  <div class="section">
    <div class="section-title">📅 次の試合</div>
    <div id="next-container"><div class="loading">取得中...</div></div>
  </div>

  <div class="footer">
    <button class="btn-back" onclick="location.href='lineup.html'">← スコアボードへ戻る</button>
  </div>
  <div class="api-note">
    データ提供: TheSportsDB（無料枠）<br>
    ※ 試合終了後に反映・数分の遅延あり ／ 3分ごと自動更新
  </div>

  <script>
    const TEAM_ID = 137506;
    const API     = 'https://www.thesportsdb.com/api/v1/json/3';
    const REFRESH = 180;
    let countdown = REFRESH, timer;

    const JA = {
      'Hanshin Tigers':               '阪神',
      'Yomiuri Giants':               '巨人',
      'Yokohama DeNA BayStars':       'DeNA',
      'Tokyo Yakult Swallows':        'ヤクルト',
      'Hiroshima Toyo Carp':          '広島',
      'Chunichi Dragons':             '中日',
      'Fukuoka SoftBank Hawks':       'ソフトバンク',
      'Tohoku Rakuten Golden Eagles': '楽天',
      'Saitama Seibu Lions':          '西武',
      'Orix Buffaloes':               'オリックス',
      'Chiba Lotte Marines':          'ロッテ',
      'Hokkaido Nippon-Ham Fighters': '日本ハム',
    };
    const ja = n => JA[n] || n;

    const isHome  = ev => String(ev.idHomeTeam) === String(TEAM_ID);
    const myScore = ev => isHome(ev) ? ev.intHomeScore : ev.intAwayScore;
    const opScore = ev => isHome(ev) ? ev.intAwayScore : ev.intHomeScore;
    const opName  = ev => ja(isHome(ev) ? ev.strAwayTeam : ev.strHomeTeam);

    function result(ev) {
      const m = parseInt(myScore(ev)), o = parseInt(opScore(ev));
      if (isNaN(m)||isNaN(o)) return 'unknown';
      return m>o?'win':m<o?'lose':'draw';
    }

    function fmtDate(s) {
      if (!s) return '';
      const [,m,d] = s.split('-');
      return `${parseInt(m)}月${parseInt(d)}日`;
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // イニング表の解析・生成
    function makeInningTable(strResult, ev) {
      if (!strResult) return '';
      const blocks = strResult.trim().split(/\n\n+/);
      const rows = [];
      for (const block of blocks) {
        const lines = block.trim().split('\n');
        if (lines.length < 2) continue;
        const teamName = lines[0].trim();
        const innMatch = lines.find(l => l.includes('Innings:'));
        const hitMatch = block.match(/Hits:\s*(\d+)/);
        const errMatch = block.match(/Errors:\s*(\d+)/);
        if (!innMatch) continue;
        const innings = innMatch.replace('Innings:','').trim().split(/\s+/).map(Number);
        rows.push({
          name: teamName,
          isTigers: teamName.includes('Hanshin'),
          innings,
          hits:   hitMatch ? parseInt(hitMatch[1]) : '-',
          errors: errMatch ? parseInt(errMatch[1]) : '-',
        });
      }
      if (rows.length < 1) return '';

      // 阪神を上段に
      rows.sort((a,b) => b.isTigers - a.isTigers);
      const maxInn = Math.max(...rows.map(r => r.innings.length));
      const heads  = Array.from({length:maxInn},(_,i)=>`<th>${i+1}</th>`).join('');

      const trs = rows.map(r => {
        const cells = r.innings.map(v=>`<td>${v}</td>`).join('');
        const total = r.innings.reduce((a,b)=>a+b,0);
        const cls   = r.isTigers ? 'tigers-row' : '';
        const label = r.isTigers ? '🐯 阪神' : ja(r.name.replace('Tigers','').replace('Giants','').trim()) || r.name;
        return `<tr class="${cls}">
          <td class="tname">${label}</td>
          ${cells}
          <td class="t-total">${total}</td>
          <td>${r.hits}</td>
          <td>${r.errors}</td>
        </tr>`;
      }).join('');

      return `<div class="inning-wrap"><table class="inn-table">
        <thead><tr>
          <th class="tname">チーム</th>${heads}
          <th class="t-total">計</th><th>安</th><th>失</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table></div>`;
    }

    function makeResultCard(ev) {
      const r  = result(ev);
      const ms = myScore(ev), os = opScore(ev);
      const rLabel = {win:'勝',lose:'負',draw:'分',unknown:''}[r];
      const haStr  = isHome(ev) ? '🏟 ホーム' : '✈ ビジター';
      const inn    = makeInningTable(ev.strResult, ev);

      return `<div class="game-card ${r}">
        <div class="game-top">
          <span class="game-date-str">${fmtDate(ev.dateEvent)}　${haStr}</span>
          <div class="badges">
            <span class="badge badge-ft">試合終了</span>
            ${rLabel ? `<span class="badge badge-${r}">${rLabel}</span>` : ''}
          </div>
        </div>
        <div class="matchup">
          <div class="team-block">
            <div class="team-name tigers">阪神</div>
            <div class="score tigers">${ms ?? '-'}</div>
          </div>
          <div class="vs">vs</div>
          <div class="team-block">
            <div class="team-name">${opName(ev)}</div>
            <div class="score opp">${os ?? '-'}</div>
          </div>
        </div>
        ${ev.strVenue ? `<div class="venue-str">📍 ${ev.strVenue}</div>` : ''}
        ${inn}
      </div>`;
    }

    function makeNextCard(ev) {
      const haStr = isHome(ev) ? '🏟 ホーム' : '✈ ビジター';
      const time  = ev.strTimestamp ? `　${fmtTime(ev.strTimestamp)}` : '';
      return `<div class="game-card next">
        <div class="game-top">
          <span class="game-date-str">${fmtDate(ev.dateEvent)}${time}　${haStr}</span>
          <span class="badge badge-ns">予定</span>
        </div>
        <div class="matchup">
          <div class="team-block"><div class="team-name tigers">阪神</div><div class="score none">-</div></div>
          <div class="vs">vs</div>
          <div class="team-block"><div class="team-name">${opName(ev)}</div><div class="score none">-</div></div>
        </div>
        ${ev.strVenue ? `<div class="venue-str">📍 ${ev.strVenue}</div>` : ''}
      </div>`;
    }

    async function fetchJ(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    async function loadAll() {
      clearInterval(timer);
      countdown = REFRESH;
      startCountdown();

      try {
        const [lastData, nextData] = await Promise.all([
          fetchJ(`${API}/eventslast.php?id=${TEAM_ID}`),
          fetchJ(`${API}/eventsnext.php?id=${TEAM_ID}`)
        ]);

        // 直近の試合
        const lastEvents = lastData.results || [];
        const rc = document.getElementById('result-container');
        if (lastEvents.length === 0) {
          rc.innerHTML = '<div class="empty-msg">試合データがありません</div>';
        } else {
          rc.innerHTML = lastEvents.map(makeResultCard).join('');
        }

        // 次の試合
        const nextEvents = (nextData.events || []).slice(0, 5);
        const nc = document.getElementById('next-container');
        if (nextEvents.length === 0) {
          nc.innerHTML = '<div class="empty-msg">次の試合データがありません</div>';
        } else {
          nc.innerHTML = nextEvents.map(makeNextCard).join('');
        }

        const now = new Date();
        document.getElementById('last-updated').textContent =
          `最終更新: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

      } catch(e) {
        const err = `<div class="error-msg">⚠ 取得失敗: ${e.message}</div>`;
        document.getElementById('result-container').innerHTML = err;
        document.getElementById('next-container').innerHTML = err;
      }
    }

    function startCountdown() {
      timer = setInterval(() => {
        countdown--;
        const m = Math.floor(countdown/60), s = countdown%60;
        document.getElementById('countdown').textContent =
          `更新まで ${m}:${String(s).padStart(2,'0')}`;
        if (countdown <= 0) { clearInterval(timer); loadAll(); }
      }, 1000);
    }

    loadAll();
  </script>
</body>
</html>
